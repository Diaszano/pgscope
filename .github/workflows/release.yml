name: Release

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: "PAT that opens the release PR and creates the tag and GitHub Release, so downstream workflows run"
        required: true
    outputs:
      released:
        description: "True if a new release was published"
        value: ${{ jobs.release-please.outputs.released }}
      tag:
        description: "New release tag (e.g., v0.3.0)"
        value: ${{ jobs.release-please.outputs.tag }}
      release_sha:
        description: "Exact git commit SHA published for release"
        value: ${{ jobs.release-please.outputs.release_sha }}
      version:
        description: "Clean semantic version string (e.g., 0.3.0)"
        value: ${{ jobs.release-please.outputs.version }}

concurrency:
  group: image-alias-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Only the PAT writes to the repository; the job token stays read-only.
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes to main either update the open release PR or, when that PR was merged,
      # create the vX.Y.Z tag and GitHub Release. A PAT is required: events created by
      # GITHUB_TOKEN do not trigger CI on the release PR or the binaries workflow.
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge on the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # List through the REST API: `gh pr list --label` uses search, which can miss a PR
          # created seconds ago, so the release PR would never get auto-merge.
          PR_NUMBERS=$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | select(any(.labels[]; .name == "autorelease: pending")) | .number')
          PR_NUMBER="${PR_NUMBERS%%$'\n'*}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No open release pull request."
            exit 0
          fi

          echo "Enabling auto-merge for release PR #${PR_NUMBER}"
          # --auto is refused when every requirement is already met; the PR can then be merged directly.
          gh pr merge "${PR_NUMBER}" --auto --squash || gh pr merge "${PR_NUMBER}" --squash

  publish-dist:
    name: Attach Distributions to Release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Build wheel and sdist
        run: bash scripts/release/build.sh

      - name: Upload distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz --clobber

  build-image:
    name: Build & Stage Multiarch GHCR Image
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging multiarch image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/diaszano/pgscope:sha-${{ needs.release-please.outputs.release_sha }}
          build-args: |
            REVISION=${{ needs.release-please.outputs.release_sha }}
            VERSION=${{ needs.release-please.outputs.version }}
          provenance: true
          sbom: true

  promote-image:
    name: Promote Release GHCR Aliases
    needs: [release-please, build-image]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sfLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz
          trivy --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to stable tags
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
          IMAGE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          bash scripts/ci/promote_image.sh "ghcr.io/diaszano/pgscope" "$IMAGE_DIGEST" "$IMAGE_TAG"
